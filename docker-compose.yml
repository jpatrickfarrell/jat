services:
  jat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jat-ide
    ports:
      - "3333:3333"
    volumes:
      # Host config — credentials, project registry, review rules
      - ${HOME}/.config/jat:/root/.config/jat

      # Claude Code — settings, hooks, session identity files
      - ${HOME}/.claude:/root/.claude

      # Agent Mail database
      - ${HOME}/.agent-mail.db:/root/.agent-mail.db

      # Project directories (add your own project paths here)
      # The IDE scans these for .jat/ task databases
      - ${JAT_PROJECTS:-${HOME}/code}:/root/code

      # Signal files — shared with host tmux agent sessions
      - /tmp:/tmp

    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3333

    restart: unless-stopped

    # Health check — IDE responds on /api/config/defaults
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3333/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
